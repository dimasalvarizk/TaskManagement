<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Mode — ODST Task Management</title>
  <link rel="icon" href="/logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d0d0e;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #151720;
      border: 1px solid #232738;
      padding: 40px 32px;
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #1e2230;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #31374a;
    }
    .logo-container img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      background: #4338ca;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/logo.png" alt="TaskFlow ODST" />
    </div>
    <div class="badge">📡 Currently Offline</div>
    <h1>No Internet Connection</h1>
    <p>
      You are currently offline. Locally cached workspace data remains available on your installed application.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Reload Page
    </button>
  </div>
</body>
</html>
